<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ball Game</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="hud" aria-live="polite">
      <div class="hud__item">
        <span>Score</span>
        <strong id="scoreEl">0</strong>
      </div>
      <div class="hud__item">
        <span>Best</span>
        <strong id="bestScoreEl">0</strong>
      </div>
      <div class="hud__item">
        <span>Stage</span>
        <strong id="stageEl">1</strong>
      </div>
    </div>

    <div class="toolbar">
      <button id="pauseButton" class="toolbar__button" type="button">Pause</button>
      <button id="restartButton" class="toolbar__button" type="button">Restart</button>
    </div>

    <canvas aria-label="Ball shooting game"></canvas>

    <div id="overlay" class="overlay">
      <div class="overlay__panel">
        <p id="overlayEyebrow" class="overlay__eyebrow">Best <span id="modalBestScoreEl">0</span></p>
        <h1 id="overlayTitle">Ball Game</h1>
        <p id="overlayScore" class="overlay__score">Score 0</p>
        <div id="overlayInstructions" class="overlay__instructions">
          <p>Click or tap anywhere to shoot from the center. Stop every enemy before it reaches you.</p>
          <div class="stage-list" aria-label="Stage score goals">
            <span>Stage 1: 0</span>
            <span>Stage 2: 100</span>
            <span>Stage 3: 250</span>
            <span>Stage 4: 450</span>
            <span>Stage 5: 700</span>
          </div>
        </div>
        <button id="primaryButton" class="overlay__button" type="button">Start</button>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
